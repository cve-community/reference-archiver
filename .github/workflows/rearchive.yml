name: Re-archive Scheduled References

on:
  schedule:
    - cron: '45 * * * *'  # Hourly, 15 min after the crawl
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — show what would be re-archived'
        required: false
        default: 'false'
        type: string
      max_cves:
        description: 'Max CVEs to process per run (the chain runs this about hourly)'
        required: false
        default: '20'
        type: string
      annotate_max:
        description: 'Max ledger entries to back-fill date_published for, per run'
        required: false
        default: '20000'
        type: string

permissions:
  id-token: write
  contents: read

env:
  S3_BUCKET: ${{ vars.S3_BUCKET || 'archiver-demo-v1-public' }}
  AWS_REGION: us-east-1

concurrency:
  group: cve-archiving
  cancel-in-progress: false

jobs:
  check-schedule:
    name: Check re-archive schedule
    runs-on: ubuntu-latest
    outputs:
      cves_due: ${{ steps.check.outputs.cves_due }}
      cve_list: ${{ steps.check.outputs.cve_list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Back-fill publication dates in the ledger
        if: inputs.dry_run != 'true'
        env:
          ANNOTATE_MAX: ${{ inputs.annotate_max || '20000' }}
        run: |
          set -euo pipefail

          aws s3 cp "s3://${S3_BUCKET}/v2/schedule.json" /tmp/schedule.json 2>/dev/null \
            || echo '{"entries":[]}' > /tmp/schedule.json

          # Entries registered before date_published was recorded, or whose lookup
          # failed last time. At most ANNOTATE_MAX per run; the rest wait a cycle.
          jq -r --argjson max "$ANNOTATE_MAX" \
            '[.entries[] | select(.date_published == null) | .cve_id] | .[0:$max] | .[]' \
            /tmp/schedule.json > /tmp/need_pub.txt
          NEED=$(grep -c . /tmp/need_pub.txt || true)
          if [ "$NEED" = "0" ]; then
            echo "Every ledger entry carries date_published" >&2
            exit 0
          fi

          echo "Looking up datePublished for $NEED entries" >&2
          scripts/cve-published-dates.sh < /tmp/need_pub.txt > /tmp/pub_dates.tsv
          GOT=$(grep -c . /tmp/pub_dates.tsv || true)
          echo "Resolved $GOT of $NEED" >&2
          [ "$GOT" != "0" ] || exit 0

          jq --rawfile tsv /tmp/pub_dates.tsv '
            ($tsv | split("\n") | map(select(length > 0) | split("\t") | {key: .[0], value: .[1]}) | from_entries) as $pub
            | .entries |= map(if .date_published == null and $pub[.cve_id] != null then .date_published = $pub[.cve_id] else . end)
          ' /tmp/schedule.json > /tmp/schedule_annotated.json
          aws s3 cp /tmp/schedule_annotated.json "s3://${S3_BUCKET}/v2/schedule.json" \
            --content-type application/json
          echo "::notice::Back-filled date_published for $GOT ledger entries ($((NEED - GOT)) unresolved)"

      - name: Check what needs re-archiving
        id: check
        env:
          MAX_CVES: ${{ inputs.max_cves || '20' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          aws s3 cp "s3://${S3_BUCKET}/v2/schedule.json" /tmp/schedule.json 2>/dev/null \
            || echo '{"entries":[]}' > /tmp/schedule.json

          # Intervals run from publication (PRD 2.4); see scripts/rearchive_schedule.py
          python3 scripts/rearchive_schedule.py due --schedule /tmp/schedule.json --max "$MAX_CVES" > /tmp/due.json

          DUE_COUNT=$(jq '.due | length' /tmp/due.json)
          echo "Due: $DUE_COUNT CVEs (of $(jq .total_due /tmp/due.json) total due)" >&2

          echo "cves_due=${DUE_COUNT}" >> "$GITHUB_OUTPUT"
          echo "cve_list=$(jq -c .due /tmp/due.json)" >> "$GITHUB_OUTPUT"

          {
            echo "### Re-archive Schedule Check"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Total entries tracked | $(jq .total_entries /tmp/due.json) |"
            echo "| Entries with nothing left to re-archive | $(jq .nothing_left /tmp/due.json) |"
            echo "| Entries missing date_published | $(jq .missing_date_published /tmp/due.json) |"
            echo "| CVEs due for re-archive | $(jq .total_due /tmp/due.json) |"
            echo "| CVEs to process this run | $DUE_COUNT |"
            echo "| Dry run | $DRY_RUN |"
            echo ""
            if [ "$DUE_COUNT" != "0" ]; then
              echo "**Due:**"
              jq -r '.details[:20][] | "- \(.cve_id) (intervals: \(.intervals | join("/"))d, due since: \(.due_since[:10]))"' /tmp/due.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  rearchive:
    name: Re-archive ${{ matrix.cve_id }}
    needs: check-schedule
    if: needs.check-schedule.outputs.cves_due != '0' && inputs.dry_run != 'true'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        cve_id: ${{ fromJSON(needs.check-schedule.outputs.cve_list) }}
    uses: ./.github/workflows/archive-cve.yml
    with:
      cve_id: ${{ matrix.cve_id }}
    secrets: inherit

  update-schedule:
    name: Update schedule after re-archiving
    needs: [check-schedule, rearchive]
    if: always() && needs.check-schedule.outputs.cves_due != '0' && inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Mark completed intervals
        env:
          CVE_LIST: ${{ needs.check-schedule.outputs.cve_list }}
        run: |
          set -euo pipefail

          aws s3 cp "s3://${S3_BUCKET}/v2/schedule.json" /tmp/schedule.json 2>/dev/null \
            || echo '{"entries":[]}' > /tmp/schedule.json

          # One catch-up snapshot covers every interval that was overdue.
          python3 scripts/rearchive_schedule.py mark --schedule /tmp/schedule.json \
            --cves "$CVE_LIST" --out /tmp/schedule_updated.json

          aws s3 cp /tmp/schedule_updated.json "s3://${S3_BUCKET}/v2/schedule.json" \
            --content-type application/json

  # Second leg of the self-chaining loop (see crawl-cves.yml).
  chain:
    name: Chain next run
    needs: [check-schedule, rearchive, update-schedule]
    if: always() && vars.AUTO_CHAIN == 'true' && inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHECK_RESULT: ${{ needs.check-schedule.result }}
      CVES_DUE: ${{ needs.check-schedule.outputs.cves_due }}
    steps:
      - name: Pace the loop
        if: env.CHECK_RESULT != 'success'
        run: |
          echo "::warning::check-schedule ended with '$CHECK_RESULT'; backing off 15 min before chaining"
          sleep 900

      - name: Rebuild site
        if: env.CVES_DUE != '0' && env.CHECK_RESULT == 'success'
        run: gh workflow run site.yml --ref main -R "$GITHUB_REPOSITORY"

      - name: Dispatch crawl
        run: gh workflow run crawl-cves.yml --ref main -R "$GITHUB_REPOSITORY"
